# 将 dist/ 构建产物发布到 GitHub Pages 分支（gh-pages）。
# 仓库的 Pages 站点源为「分支部署」（gh-pages），因此这里直接推送构建产物，
# 不再使用 deploy-pages@v4（它要求 Pages 源为 GitHub Actions，此前一直失败）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [work, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (vue-tsc --noEmit && vite build)
        run: npm run build

      - name: Publish dist/ to gh-pages
        run: |
          set -e
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7} 飞机货运 AGV 数字孪生构建产物"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
